# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "458074526009886bc7bb10307498f361"
name = "Sticky Add to Cart"
application_url = "https://sticky-add-to-cart-6nft.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/api/webhooks"
  topics = [ "app/scopes_update", "app/uninstalled" ]
  compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products"

[auth]
redirect_urls = [
  "https://sticky-add-to-cart-6nft.onrender.com/auth/callback",
  "https://sticky-add-to-cart-6nft.onrender.com/auth/shopify/callback",
  "https://sticky-add-to-cart-6nft.onrender.com/api/auth/callback"
]
